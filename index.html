<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>NE PAS APPUYER</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Teko:wght@700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --red: #ff1a1a;
    --yellow: #ffe600;
    --bg: #0d0000;

    /* button sizes — overridden for mobile below */
    --btn-size: 140px;
    --outer-size: 180px;
    --ring-size: 260px;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: 'Teko', sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  /* grain */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E");
    background-size: 200px 200px;
    pointer-events: none; z-index: 9998; opacity: 0.4;
  }

  /* vignette */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.85) 100%);
    pointer-events: none; z-index: 9997;
  }

  #app {
    width: 100vw; height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    gap: 0;
  }

  /* counter */
  #counter-wrap {
    position: absolute;
    top: max(18px, env(safe-area-inset-top, 18px));
    left: 50%; transform: translateX(-50%);
    text-align: center;
  }

  #counter-label {
    font-size: clamp(10px, 3vw, 13px);
    letter-spacing: 3px;
    color: #ff3333;
    text-transform: uppercase;
  }

  #counter {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(28px, 10vw, 80px);
    color: #fff;
    text-shadow: 0 0 20px var(--red);
    line-height: 1;
  }

  #counter.bump {
    transform: scale(1.3);
    color: var(--yellow);
    text-shadow: 0 0 30px var(--yellow);
    transition: transform 0.05s, color 0.05s;
  }

  /* title */
  #title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(28px, 10vw, 64px);
    color: #fff;
    letter-spacing: 4px;
    text-transform: uppercase;
    text-align: center;
    line-height: 1.1;
    margin-bottom: 10px;
    text-shadow: 0 0 30px rgba(255,30,30,0.6);
  }

  #subtitle {
    font-size: clamp(13px, 4vw, 26px);
    color: #ff6666;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: clamp(30px, 7vw, 60px);
    text-align: center;
    animation: subtitlePulse 2s ease-in-out infinite;
  }

  @keyframes subtitlePulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* pedestal */
  #pedestal {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #glow-ring {
    position: absolute;
    width: var(--ring-size); height: var(--ring-size);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,20,20,0.25) 0%, transparent 70%);
    animation: ringPulse 1.5s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes ringPulse {
    0%, 100% { transform: scale(1); opacity: 0.7; }
    50%       { transform: scale(1.15); opacity: 1; }
  }

  #btn-outer {
    width: var(--outer-size); height: var(--outer-size);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #3a0000, #150000);
    border: 4px solid #3a0000;
    display: flex; align-items: center; justify-content: center;
    box-shadow:
      0 0 0 8px #1e0000,
      0 0 0 12px #2a0000,
      0 12px 40px rgba(0,0,0,0.8),
      inset 0 4px 8px rgba(255,80,80,0.1);
    position: relative; z-index: 1;
  }

  #btn {
    width: var(--btn-size); height: var(--btn-size);
    border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #ff6666, #cc0000 55%, #7a0000);
    border: none;
    cursor: pointer;
    position: relative;
    box-shadow:
      0 6px 0 #5a0000,
      0 8px 20px rgba(0,0,0,0.5),
      inset 0 3px 6px rgba(255,200,200,0.3),
      0 0 40px rgba(255,0,0,0.5);
    transition: transform 0.08s, box-shadow 0.08s;
    outline: none;
    -webkit-appearance: none;
  }

  #btn::before {
    content: '';
    position: absolute;
    top: 14%; left: 18%;
    width: 40%; height: 28%;
    background: radial-gradient(ellipse, rgba(255,255,255,0.35), transparent);
    border-radius: 50%;
    pointer-events: none;
  }

  #btn:hover {
    box-shadow:
      0 6px 0 #5a0000,
      0 8px 20px rgba(0,0,0,0.5),
      inset 0 3px 6px rgba(255,200,200,0.3),
      0 0 60px rgba(255,0,0,0.8),
      0 0 100px rgba(255,0,0,0.4);
    transform: scale(1.04);
  }

  #btn:active {
    transform: translateY(5px) scale(0.95);
    box-shadow:
      0 1px 0 #5a0000,
      0 2px 8px rgba(0,0,0,0.5),
      inset 0 3px 6px rgba(255,200,200,0.2),
      0 0 30px rgba(255,0,0,0.6);
  }

  /* flash */
  #flash {
    position: fixed; inset: 0;
    background: var(--red);
    opacity: 0;
    pointer-events: none;
    z-index: 9996;
    transition: opacity 0.05s;
  }
  #flash.go { opacity: 0.45; }

  /* particles */
  #particles {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 9995;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    animation: flyOut 0.8s ease-out forwards;
    font-size: clamp(18px, 5vw, 28px);
    line-height: 1;
  }

  @keyframes flyOut {
    0%   { transform: translate(-50%,-50%) scale(1);  opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
  }

  /* toast */
  #toast {
    position: fixed;
    bottom: max(32px, env(safe-area-inset-bottom, 32px));
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(20,0,0,0.92);
    border: 1px solid var(--red);
    border-radius: 8px;
    padding: clamp(8px,2vw,12px) clamp(16px,5vw,28px);
    font-size: clamp(13px, 4vw, 20px);
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fff;
    text-align: center;
    max-width: 92vw;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 9999;
    pointer-events: none;
  }

  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* warning */
  #warning {
    position: absolute;
    bottom: max(16px, env(safe-area-inset-bottom, 16px));
    left: 50%; transform: translateX(-50%);
    font-size: clamp(9px, 2.5vw, 14px);
    letter-spacing: 2px;
    color: #440000;
    text-transform: uppercase;
    white-space: nowrap;
    text-align: center;
    padding: 0 12px;
  }

  /* title shake */
  @keyframes titleShake {
    0%,100% { transform: rotate(0deg); }
    20% { transform: rotate(-3deg) scale(1.05); }
    40% { transform: rotate(3deg) scale(1.07); }
    60% { transform: rotate(-2deg); }
    80% { transform: rotate(2deg); }
  }
  #title.shake { animation: titleShake 0.4s ease; }

  /* screen shake */
  @keyframes screenShake {
    0%,100% { transform: translate(0,0); }
    20% { transform: translate(-5px, 3px); }
    40% { transform: translate(5px, -3px); }
    60% { transform: translate(-3px, 4px); }
    80% { transform: translate(3px, -2px); }
  }
  body.shake { animation: screenShake 0.3s ease; }

  /* milestone */
  #milestone {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(36px, 14vw, 130px);
    color: var(--yellow);
    text-shadow: 0 0 60px rgba(255,230,0,0.8);
    pointer-events: none;
    z-index: 9999;
    opacity: 0;
    text-align: center;
    line-height: 1.1;
    letter-spacing: -2px;
    padding: 0 16px;
  }

  @keyframes milestoneAnim {
    0%   { transform: translate(-50%,-50%) scale(0.3); opacity: 0; }
    30%  { transform: translate(-50%,-50%) scale(1.1);  opacity: 1; }
    60%  { transform: translate(-50%,-50%) scale(0.97); opacity: 1; }
    85%  { transform: translate(-50%,-50%) scale(1.02); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(1);    opacity: 0; }
  }

  #milestone.pop { animation: milestoneAnim 1.2s ease forwards; }

  /* ── MOBILE OVERRIDES ── */
  @media (max-width: 480px) or (max-height: 700px) {
    :root {
      --btn-size:  clamp(100px, 36vw, 130px);
      --outer-size: clamp(128px, 46vw, 165px);
      --ring-size:  clamp(190px, 68vw, 240px);
    }
  }
</style>
</head>
<body>

<div id="flash"></div>
<div id="particles"></div>
<div id="milestone"></div>

<div id="app">

  <div id="counter-wrap">
    <div id="counter-label">Victimes</div>
    <div id="counter">0</div>
  </div>

  <div id="title">NE PAS<br>APPUYER</div>
  <div id="subtitle">⚠️ surtout pas ⚠️</div>

  <div id="pedestal">
    <div id="glow-ring"></div>
    <div id="btn-outer">
      <button id="btn" onclick="handleClick()"></button>
    </div>
  </div>

  <div id="warning">Ce bouton ne fait rien d'important • promis</div>
</div>

<div id="toast"></div>

<script>
  const RICK = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";

  const toasts = [
    "🚨 TROP TARD",
    "😂 T'AS VRAIMENT CLIQUÉ",
    "🐸 KEKW",
    "💀 RIP",
    "🤡 SKILL ISSUE",
    "⚡ GET REKT",
    "🎵 NEVER GONNA...",
    "😈 BIEN FAIT",
    "🏆 ACHIEVEMENT : NOOB",
    "🔥 RICKROLLÉ",
    "👀 T'EN VOULAIS ENCORE ?",
    "🦆 QUACK",
    "🎯 HEADSHOT",
    "😭 J'AVAIS PRÉVENU",
    "🎶 GIVE YOU UP",
  ];

  const emojis = ['💀','🔥','😂','🤡','💥','🎵','👀','😈','🏆','🤣','⚡','🎮','🐸','👾','🤯'];

  const milestones = {
    1:   "RICKROLLÉ 🎵",
    5:   "5x 🤡",
    10:  "10x 😂",
    20:  "Tu l'aimes 💀",
    50:  "ADDICT 🔥",
    100: "LÉGENDE 🏆",
  };

  let count = 0;

  function handleClick() {
    count++;
    window.open(RICK, '_blank');

    // counter bump
    const counterEl = document.getElementById('counter');
    counterEl.textContent = count;
    counterEl.classList.remove('bump');
    void counterEl.offsetWidth;
    counterEl.classList.add('bump');
    setTimeout(() => counterEl.classList.remove('bump'), 200);

    // flash
    const flash = document.getElementById('flash');
    flash.classList.add('go');
    setTimeout(() => flash.classList.remove('go'), 120);

    // screen shake
    document.body.classList.remove('shake');
    void document.body.offsetWidth;
    document.body.classList.add('shake');

    // title shake
    const title = document.getElementById('title');
    title.classList.remove('shake');
    void title.offsetWidth;
    title.classList.add('shake');

    // particles
    spawnParticles();

    // toast
    showToast(toasts[Math.floor(Math.random() * toasts.length)]);

    // milestone
    if (milestones[count]) showMilestone(milestones[count]);
  }

  function spawnParticles() {
    const container = document.getElementById('particles');
    const btn = document.getElementById('btn');
    const rect = btn.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top  + rect.height / 2;
    const dist = Math.min(window.innerWidth, window.innerHeight) * 0.35;

    const n = 10 + Math.floor(Math.random() * 8);
    for (let i = 0; i < n; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      const angle = Math.random() * Math.PI * 2;
      const d = dist * (0.6 + Math.random() * 0.8);
      p.style.left = cx + 'px';
      p.style.top  = cy + 'px';
      p.style.setProperty('--tx', Math.cos(angle) * d + 'px');
      p.style.setProperty('--ty', Math.sin(angle) * d + 'px');
      p.style.animationDuration = (0.5 + Math.random() * 0.5) + 's';
      container.appendChild(p);
      setTimeout(() => p.remove(), 1000);
    }
  }

  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1700);
  }

  function showMilestone(msg) {
    const m = document.getElementById('milestone');
    m.textContent = msg;
    m.classList.remove('pop');
    void m.offsetWidth;
    m.classList.add('pop');
  }

  // hover glow speed
  const btn = document.getElementById('btn');
  btn.addEventListener('mouseenter', () => {
    document.getElementById('glow-ring').style.animationDuration = '0.6s';
  });
  btn.addEventListener('mouseleave', () => {
    document.getElementById('glow-ring').style.animationDuration = '1.5s';
  });
</script>
</body>
</html>
